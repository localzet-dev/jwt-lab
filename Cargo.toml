[package]
name = "jwt-lab"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"

clap = { version = "4", features = ["derive"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = {
    version = "1",
    features = ["macros", "rt-multi-thread", "fs", "io-util"]
}

jsonwebtoken = {
    version = "11",
    features = ["rust_crypto"]
}

getrandom = "0.4"
hmac = "0.12"
sha2 = "0.10"
